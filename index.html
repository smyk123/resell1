<!DOCTYPE html>
<html lang="pl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ResellTracker</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💰</text></svg>">

  <!-- Tailwind Config -->
  <script>
    tailwind.config = {

          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0a0a0a;
      color: #ffffff;
      color-scheme: dark;
    }

    /* Hide scrollbar */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Input adjustments for dark mode */
    input[type="date"]::-webkit-calendar-picker-indicator {
      cursor: pointer;
      filter: invert(1);
      opacity: 0.6;
      transition: 0.2s;
    }

    input[type="date"]::-webkit-calendar-picker-indicator:hover {
      opacity: 1;
    }

    select option {
      background-color: #171717;
      color: #ffffff;
    }

    /* PIN Lock */
    @keyframes pinShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-6px); }
      80% { transform: translateX(6px); }
    }
    .pin-shake { animation: pinShake 0.4s ease; }

    @keyframes pinDotPop {
      0% { transform: scale(0.6); opacity: 0.4; }
      60% { transform: scale(1.15); }
      100% { transform: scale(1); opacity: 1; }
    }
    .pin-dot-filled { animation: pinDotPop 0.15s ease forwards; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fadeIn 0.35s ease both; }

    /* Sync pulse */
    @keyframes syncPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }
    /* HUD Animation */
    @keyframes spin-slow { 100% { transform: rotate(360deg); } }
    @keyframes spin-reverse { 100% { transform: rotate(-360deg); } }
    .hud-ring-1 { animation: spin-slow 8s linear infinite; }
    .hud-ring-2 { animation: spin-reverse 6s linear infinite; }
    .hud-ring-3 { animation: spin-slow 12s linear infinite; border-style: dashed; }
    .sync-pulse { animation: syncPulse 1.2s ease-in-out infinite; }
  </style>
</head>

<body class="bg-brand-bg text-brand-text">
  <!-- Visible error display -->
  <div id="error-display" style="display:none;position:fixed;inset:0;background:#0a0a0a;color:#ff5555;font-family:monospace;padding:40px;z-index:9999;overflow:auto;"></div>

  <div id="root">
    <!-- Loading indicator shown before React mounts -->
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0a0a0a;">
      <div style="text-align:center;color:#a3a3a3;">
        <div style="font-size:32px;margin-bottom:12px;">💰</div>
        <div style="font-size:14px;">Ładowanie ResellTracker...</div>
      </div>
    </div>
  </div>

  <!-- Global error catcher -->
  <script>
    window.onerror = function(msg, src, line, col, err) {
      var el = document.getElementById('error-display');
      el.style.display = 'block';
      el.innerHTML = '<h2 style="color:#ff5555;margin-bottom:16px">⚠️ JavaScript Error (copy this and report it)</h2>'
        + '<pre style="background:#111;padding:16px;border-radius:8px;overflow:auto;font-size:12px;color:#ffaa44;">'
        + 'Message: ' + msg + '\n'
        + 'Source:  ' + src + '\n'
        + 'Line:    ' + line + ':' + col + '\n'
        + (err && err.stack ? '\nStack:\n' + err.stack : '')
        + '</pre>';
    };
    window.addEventListener('unhandledrejection', function(e) {
      var el = document.getElementById('error-display');
      el.style.display = 'block';
      el.innerHTML += '<h2 style="color:#ff9944;margin-top:24px;margin-bottom:8px">⚠️ Unhandled Promise Rejection</h2>'
        + '<pre style="background:#111;padding:16px;border-radius:8px;font-size:12px;color:#ffaa44;">' + (e.reason || e) + '</pre>';
    });
  </script>

  <!-- Service Worker: unregister all, clear caches, reload once for clean start -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        var had = registrations.length > 0;
        var done = registrations.map(function(reg) { return reg.unregister(); });
        return Promise.all(done).then(function() {
          if (window.caches) {
            return caches.keys().then(function(keys) {
              return Promise.all(keys.map(function(k) { return caches.delete(k); }));
            });
          }
        }).then(function() {
          if (had && !sessionStorage.getItem('sw_cleared')) {
            sessionStorage.setItem('sw_cleared', '1');
            location.reload();
          }
        });
      });
    }
  </script>

    const FIREBASE_CONFIG = {

    // PIN that protects the app (change this to whatever you want)
    const APP_PIN = "9251";

    // Firestore document path where all data is stored
    const FIRESTORE_DOC_PATH = "resell/data";

  <script type="text/babel" data-presets="react" data-plugins="transform-class-properties">
    /* @jsxRuntime classic */
    const { useState, useEffect, useMemo, useRef, useCallback } = React;

    // ── PIN Lock Screen ──────────────────────────────────────────
    function PinLock({ onUnlock }) {
      const [digits, setDigits]     = useState([]);
      const [shake, setShake]       = useState(false);
      const [error, setError]       = useState('');
      const [granted, setGranted]   = useState(false);
      const PIN_LENGTH = APP_PIN.length;

      const handleDigit = useCallback((d) => {
        if (digits.length >= PIN_LENGTH || granted) return;
        const next = [...digits, d];
        setDigits(next);
        if (next.length === PIN_LENGTH) {
          setTimeout(() => {
            if (next.join('') === APP_PIN) {
              setGranted(true);
              setTimeout(() => onUnlock(), 3000);
            } else {
              setShake(true);
              setError('Nieprawidłowy PIN');
              setTimeout(() => { setDigits([]); setShake(false); setError(''); }, 600);
            }
          }, 120);
        }
      }, [digits, granted]);

      const handleBackspace = useCallback(() => {
        setDigits(d => d.slice(0, -1));
        setError('');
      }, []);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key >= '0' && e.key <= '9') handleDigit(e.key);
          if (e.key === 'Backspace') handleBackspace();
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [handleDigit, handleBackspace]);

      return (
        <div className="fixed inset-0 flex flex-col items-center justify-center bg-brand-bg" style={{zIndex:9999}}>
          {granted && (
            <div className="absolute inset-0 z-50 flex items-center justify-center bg-black overflow-hidden">
              <div className="relative w-64 h-64 md:w-80 md:h-80 flex items-center justify-center">
                {/* HUD Rings */}
                <div className="absolute inset-0 rounded-full border-4 border-t-white border-r-white/20 border-b-white/50 border-l-white/20 hud-ring-1"></div>
                <div className="absolute inset-2 rounded-full border-2 border-white/40 hud-ring-2" style={{ borderStyle: 'dashed' }}></div>
                <div className="absolute inset-6 rounded-full border-4 border-t-white/80 border-r-transparent border-b-white/80 border-l-transparent hud-ring-3"></div>
                <div className="absolute inset-10 rounded-full border border-white/20 hud-ring-1" style={{ animationDuration: '15s' }}></div>
                <div className="absolute inset-0 rounded-full shadow-[0_0_50px_rgba(255,255,255,0.15)]"></div>
                
                {/* Center Text */}
                <div className="z-10 text-center fade-in">
                  <h1 className="text-white text-xl md:text-2xl font-bold uppercase tracking-[0.3em]" style={{ fontFamily: 'monospace', textShadow: '0 0 10px rgba(255,255,255,0.8)' }}>
                    Access<br/>Granted
                  </h1>
                </div>
              </div>
            </div>
          )}
          {/* Subtle grid background */}
          <div style={{
            position:'absolute', inset:0,
            backgroundImage:'radial-gradient(circle at 50% 0%, rgba(0,230,118,0.06) 0%, transparent 70%)',
            pointerEvents:'none'
          }}/>

          <div className="fade-in flex flex-col items-center gap-8 relative z-10">
            {/* Logo */}
            <div className="flex flex-col items-center gap-3">
              <div className="w-16 h-16 bg-brand-card border border-brand-border rounded-2xl flex items-center justify-center shadow-2xl" style={{boxShadow:'0 0 40px rgba(0,230,118,0.12)'}}>
                <i data-lucide="package" style={{width:28,height:28,color:'#00E676'}}></i>
              </div>
              <h1 className="text-xl font-semibold text-white tracking-tight">ResellTracker</h1>
              <p className="text-brand-muted text-sm">Wprowadź PIN, aby kontynuować</p>
            </div>

            {/* PIN dots */}
            <div className={`flex gap-4 ${shake ? 'pin-shake' : ''}`}>
              {Array.from({length: PIN_LENGTH}).map((_, i) => (
                <div
                  key={i}
                  className={`w-4 h-4 rounded-full border-2 transition-all duration-150 ${i < digits.length ? 'bg-[#00E676] border-[#00E676] pin-dot-filled' : 'bg-transparent border-brand-border'}`}
                />
              ))}
            </div>

            {error && <p className="text-red-400 text-xs font-medium -mt-4">{error}</p>}

            {/* Numpad */}
            <div className="grid grid-cols-3 gap-3 w-64">
              {['1','2','3','4','5','6','7','8','9','',  '0','⌫'].map((k, idx) => {
                if (k === '') return <div key={idx} />;
                return (
                  <button
                    key={k}
                    onClick={() => k === '⌫' ? handleBackspace() : handleDigit(k)}
                    className="h-16 rounded-xl bg-brand-card border border-brand-border text-white font-semibold text-xl hover:bg-brand-hover hover:border-brand-muted active:scale-95 transition-all duration-100 flex items-center justify-center select-none"
                    style={k === '⌫' ? {color:'#a3a3a3', fontSize:'18px'} : {}}
                  >
                    {k}
                  </button>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    // ── Helpers ─────────────────────────────────────────────────
    function migrateFromLocalStorage() {
      // Try to read existing local data to migrate to Firestore on first cloud use
      const keys = ['sneaker_deliveries_v4', 'sneaker_deliveries_v3', 'sneaker_deliveries_v2'];
      for (const key of keys) {
        const saved = localStorage.getItem(key);
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) {
              return parsed.map(d => ({
                ...d,
                purchaseDate: d.purchaseDate || d.createdAt?.slice(0,10) || new Date().toISOString().slice(0,10),
                items: (d.items || []).map(i => {
                  let cond = i.condition || 'Nowe z metką';
                  if (cond === 'Nowe') cond = 'Nowe z metką';
                  if (cond === 'Jak nowe') cond = 'Bardzo dobry';
                  let stat = i.status || 'In stock';
                  if (stat === 'In Stock') stat = 'In stock';
                  return { ...i, condition: cond, status: stat, notes: i.notes || '' };
                })
              }));
            }
          } catch(e) {}
        }
      }
      return null;
    }

    // ── Main App ─────────────────────────────────────────────────
    function App() {
      const [unlocked, setUnlocked]   = useState(() => !!sessionStorage.getItem('rt_unlocked'));
      const [deliveries, setDeliveries] = useState([]);
      const [syncStatus, setSyncStatus] = useState('loading'); // 'loading' | 'synced' | 'syncing' | 'offline'
      const [fbReady]   = useState(() => typeof firebaseReady !== 'undefined' && firebaseReady);

      const [globalMonthFilter, setGlobalMonthFilter] = useState(() =>
        localStorage.getItem('sneaker_global_month') || 'All'
      );
      const [globalCategoryFilter, setGlobalCategoryFilter] = useState(() =>
        localStorage.getItem('sneaker_global_category') || 'All'
      );
      const [globalBoxSort, setGlobalBoxSort] = useState(() =>
        localStorage.getItem('sneaker_global_box_sort') || 'desc'
      );

      const [showScrollTop, setShowScrollTop] = useState(false);
      useEffect(() => {
        const handleScroll = () => setShowScrollTop(window.scrollY > 300);
        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      const fileInputRef  = useRef(null);
      const menuRef       = useRef(null);
      const popoversRef   = useRef(null);
      const quarterlyRef  = useRef(null);
      const isSavingRef   = useRef(false); // prevent echo-writes from onSnapshot
      const dataLoadedRef = useRef(false);  // prevent overwriting localStorage before Firebase loads

      const [isModalOpen, setIsModalOpen]     = useState(false);
      const [isMenuOpen, setIsMenuOpen]       = useState(false);
      const [isQuarterlyOpen, setIsQuarterlyOpen] = useState(false);
      const [activePopoverDeliveryId, setActivePopoverDeliveryId] = useState(null);
      const [newDelivery, setNewDelivery]     = useState({ name:'', boxCost:'', pairsCount:'', purchaseDate: new Date().toISOString().slice(0,10), category: 'Buty' });
      const [filters, setFilters]             = useState(() => {
        const saved = localStorage.getItem('sneaker_box_filters');
        if (saved) { try { return JSON.parse(saved); } catch(e) {} }
        return {};
      });

      // Persist UI prefs locally
      useEffect(() => { localStorage.setItem('sneaker_global_month',   globalMonthFilter); }, [globalMonthFilter]);
      useEffect(() => { localStorage.setItem('sneaker_global_category', globalCategoryFilter); }, [globalCategoryFilter]);
      useEffect(() => { localStorage.setItem('sneaker_global_box_sort', globalBoxSort);    }, [globalBoxSort]);
      useEffect(() => { localStorage.setItem('sneaker_box_filters',     JSON.stringify(filters)); }, [filters]);

      // Re-run Lucide icons after any render
      useEffect(() => {
        if (window.lucide) setTimeout(() => window.lucide.createIcons(), 0);
      });

      // ── Firebase real-time listener ───────────────────────────
      useEffect(() => {
        if (!unlocked) return;
        if (!fbReady) {
          // No Firebase — fall back to localStorage (offline mode)
          setSyncStatus('offline');
          const saved = localStorage.getItem('sneaker_deliveries_v4');
          if (saved) { try { dataLoadedRef.current = true; setDeliveries(JSON.parse(saved)); } catch(e) {} }
          else { const migrated = migrateFromLocalStorage(); if (migrated) { dataLoadedRef.current = true; setDeliveries(migrated); } }
          return;
        }

        setSyncStatus('loading');
        const docRef = window._db.doc(FIRESTORE_DOC_PATH);

        const unsub = docRef.onSnapshot(
          (snap) => {
            if (isSavingRef.current) return; // skip our own write echo
            if (snap.exists) {
              const data = snap.data();
              const cloudDeliveries = data.deliveries || [];
              if (cloudDeliveries.length > 0) {
                // Cloud has real data — use it
                dataLoadedRef.current = true;
                setDeliveries(cloudDeliveries);
                setSyncStatus('synced');
              } else {
                // Cloud is empty — maybe it was accidentally wiped, check localStorage
                const local = migrateFromLocalStorage();
                if (local && local.length > 0) {
                  docRef.set({ deliveries: local })
                    .then(() => { dataLoadedRef.current = true; setDeliveries(local); setSyncStatus('synced'); })
                    .catch(() => { dataLoadedRef.current = true; setDeliveries(local); setSyncStatus('offline'); });
                } else {
                  dataLoadedRef.current = true;
                  setDeliveries([]);
                  setSyncStatus('synced');
                }
              }
            } else {
              // First time: try to migrate local data up to the cloud
              const local = migrateFromLocalStorage();
              if (local && local.length > 0) {
                docRef.set({ deliveries: local })
                  .then(() => { dataLoadedRef.current = true; setDeliveries(local); })
                  .catch(() => { dataLoadedRef.current = true; setDeliveries(local); setSyncStatus('offline'); });
              } else {
                dataLoadedRef.current = true;
                setDeliveries([]);
              }
            }
            setSyncStatus('synced');
          },
          (err) => {
            console.error('Firestore error:', err);
            setSyncStatus('offline');
            const saved = localStorage.getItem('sneaker_deliveries_v4');
            if (saved) { try { setDeliveries(JSON.parse(saved)); } catch(e) {} }
          }
        );

        return () => unsub();
      }, [unlocked, fbReady]);

      // ── Write deliveries to Firestore (debounced 800ms) ──────
      const saveTimerRef = useRef(null);
      useEffect(() => {
        if (!unlocked) return;
        // CRITICAL: never overwrite localStorage until Firebase has loaded real data
        if (!dataLoadedRef.current) return;
        // Keep a local copy as offline backup
        localStorage.setItem('sneaker_deliveries_v4', JSON.stringify(deliveries));

        if (!fbReady || syncStatus === 'loading') return;

        clearTimeout(saveTimerRef.current);
        setSyncStatus('syncing');
        saveTimerRef.current = setTimeout(() => {
          isSavingRef.current = true;
          window._db.doc(FIRESTORE_DOC_PATH)
            .set({ deliveries })
            .then(() => { setSyncStatus('synced'); })
            .catch(() => { setSyncStatus('offline'); })
            .finally(() => { setTimeout(() => { isSavingRef.current = false; }, 300); });
        }, 800);

        return () => clearTimeout(saveTimerRef.current);
      }, [deliveries]);

      // ── Handle unlock ────────────────────────────────────────
      const handleUnlock = () => {
        sessionStorage.setItem('rt_unlocked', '1');
        setUnlocked(true);
      };

      // Close menus on outside click
      useEffect(() => {
        const handler = (e) => {
          if (menuRef.current && !menuRef.current.contains(e.target)) setIsMenuOpen(false);
          if (popoversRef.current && !popoversRef.current.contains(e.target)) setActivePopoverDeliveryId(null);
          if (quarterlyRef.current && !quarterlyRef.current.contains(e.target)) setIsQuarterlyOpen(false);
        };
        document.addEventListener('mousedown', handler);
        return () => document.removeEventListener('mousedown', handler);
      }, []);


      // Dynamic List of Available Months
      const availableMonths = useMemo(() => {
        const monthsSet = new Set();
        const polishMonths = ['Styczeń', 'Luty', 'Marzec', 'Kwiecień', 'Maj', 'Czerwiec', 'Lipiec', 'Sierpień', 'Wrzesień', 'Październik', 'Listopad', 'Grudzień'];

        deliveries.forEach(d => {
          if (d.purchaseDate) {
            const date = new Date(d.purchaseDate);
            if (!isNaN(date)) monthsSet.add(`${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`);
          }
          d.items.forEach(i => {
            if (i.saleDate) {
              const date = new Date(i.saleDate);
              if (!isNaN(date)) monthsSet.add(`${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`);
            }
          });
        });

        return Array.from(monthsSet).sort().reverse().map(val => {
          const [year, month] = val.split('-');
          return {
            value: val,
            label: `${polishMonths[parseInt(month) - 1]} ${year}`
          };
        });
      }, [deliveries]);

      // Filter by global category
      const filteredDeliveries = useMemo(() => {
        if (globalCategoryFilter === 'All') return deliveries;
        return deliveries.filter(d => (d.category || 'Buty') === globalCategoryFilter);
      }, [deliveries, globalCategoryFilter]);

      // Global Metrics (Filtered by Global Time Filter)
      const metrics = useMemo(() => {
        let totalRevenue = 0;
        let totalProfit = 0;
        let itemsSold = 0;
        let totalBoxCost = 0;
        let itemsInStock = 0;

        let filterYear = null, filterMonth = null;
        if (globalMonthFilter !== 'All') {
          const [y, m] = globalMonthFilter.split('-');
          filterYear = parseInt(y);
          filterMonth = parseInt(m) - 1;
        }

        filteredDeliveries.forEach(delivery => {
          const unitCost = Number(delivery.pairsCount) > 0 ? (Number(delivery.boxCost) || 0) / Number(delivery.pairsCount) : 0;

          // Check Delivery PurchaseDate for Box Cost aggregation (Only in 'All' mode)
          if (globalMonthFilter === 'All') {
            totalBoxCost += (Number(delivery.boxCost) || 0);
          }

          delivery.items.forEach(item => {
            // Count in stock (everything that is NOT Sold)
            if (item.status !== 'Sold') {
              itemsInStock += 1;
            }

            if (item.status === 'Sold' || item.status === 'Shipped') {
              const sell = Number(item.sellPrice) || 0;

              let countItem = true;
              if (globalMonthFilter !== 'All') {
                if (!item.saleDate) {
                  countItem = false;
                } else {
                  const sDate = new Date(item.saleDate);
                  if (sDate.getFullYear() !== filterYear || sDate.getMonth() !== filterMonth) {
                    countItem = false;
                  }
                }
              }

              if (countItem) {
                totalRevenue += sell;
                itemsSold += 1;
                if (globalMonthFilter !== 'All') {
                  totalBoxCost += unitCost;
                }
              }
            }
          });
        });

        totalProfit = totalRevenue - totalBoxCost;

        return { totalRevenue, totalProfit, itemsSold, totalBoxCost, itemsInStock };
      }, [filteredDeliveries, globalMonthFilter]);

      // Monthly Items
      const monthlyItems = useMemo(() => {
        if (globalMonthFilter === 'All') return [];

        let filterYear = null, filterMonth = null;
        const [y, m] = globalMonthFilter.split('-');
        filterYear = parseInt(y);
        filterMonth = parseInt(m) - 1;

        const items = [];
        filteredDeliveries.forEach(delivery => {
          const unitCost = Number(delivery.pairsCount) > 0 ? (Number(delivery.boxCost) || 0) / Number(delivery.pairsCount) : 0;

          delivery.items.forEach(item => {
            if ((item.status === 'Sold' || item.status === 'Shipped') && item.saleDate) {
              const date = new Date(item.saleDate);
              if (date.getFullYear() === filterYear && date.getMonth() === filterMonth) {
                items.push({
                  ...item,
                  deliveryId: delivery.id,
                  deliveryName: delivery.name,
                  unitCost: unitCost
                });
              }
            }
          });
        });

        // Sort by sale date desc
        return items.sort((a, b) => new Date(b.saleDate).getTime() - new Date(a.saleDate).getTime());
      }, [filteredDeliveries, globalMonthFilter]);

      // Quarterly Revenue
      const quarterlyRevenue = useMemo(() => {
        const map = {};
        filteredDeliveries.forEach(delivery => {
          delivery.items.forEach(item => {
            if ((item.status === 'Sold' || item.status === 'Shipped') && item.saleDate) {
              const date = new Date(item.saleDate);
              if (isNaN(date)) return;
              const year = date.getFullYear();
              const quarter = Math.floor(date.getMonth() / 3) + 1;
              const key = `${year}-Q${quarter}`;
              map[key] = (map[key] || 0) + (Number(item.sellPrice) || 0);
            }
          });
        });
        return Object.entries(map)
          .sort((a, b) => b[0].localeCompare(a[0]))
          .map(([key, revenue]) => ({ key, revenue }));
      }, [filteredDeliveries]);

      // Sorted Deliveries
      const sortedDeliveries = useMemo(() => {
        return [...filteredDeliveries].sort((a, b) => {
          if (globalBoxSort === 'alpha') {
            return (a.name || '').localeCompare(b.name || '');
          }
          if (globalBoxSort === 'alpha-desc') {
            return (b.name || '').localeCompare(a.name || '');
          }
          if (globalBoxSort === 'profit-desc' || globalBoxSort === 'profit-asc') {
            const getBoxProfit = (box) => {
              let rev = 0;
              box.items.forEach(i => {
                if (i.status === 'Sold' || i.status === 'Shipped') {
                  rev += (Number(i.sellPrice) || 0);
                }
              });
              return rev - (Number(box.boxCost) || 0);
            };
            const pA = getBoxProfit(a);
            const pB = getBoxProfit(b);
            return globalBoxSort === 'profit-desc' ? pB - pA : pA - pB;
          }
          if (globalBoxSort === 'status-sold') {
            const getSoldCount = (box) => box.items.filter(i => i.status === 'Sold' || i.status === 'Shipped').length;
            return getSoldCount(b) - getSoldCount(a);
          }
          const dateA = new Date(a.purchaseDate || a.createdAt || 0).getTime();
          const dateB = new Date(b.purchaseDate || b.createdAt || 0).getTime();
          if (globalBoxSort === 'desc') return dateB - dateA;
          if (globalBoxSort === 'asc') return dateA - dateB;
          return 0;
        });
      }, [filteredDeliveries, globalBoxSort]);

      // Handlers
      const scrollToTop = () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const openAddDeliveryModal = () => {
        setNewDelivery({ name: '', boxCost: '', pairsCount: '', purchaseDate: new Date().toISOString().slice(0, 10), category: 'Buty' });
        setIsModalOpen(true);
      };

      const handleAddDelivery = (e) => {
        e.preventDefault();
        if (!newDelivery.name || !newDelivery.purchaseDate) return;

        setDeliveries([{
          id: Date.now().toString(),
          name: newDelivery.name,
          boxCost: Number(newDelivery.boxCost) || 0,
          pairsCount: Number(newDelivery.pairsCount) || 1,
          createdAt: new Date().toISOString(),
          purchaseDate: newDelivery.purchaseDate,
          category: newDelivery.category || 'Buty',
          items: []
        }, ...deliveries]);

        setIsModalOpen(false);
      };

      const updateDeliveryCategory = (deliveryId, category) => {
        const updatedDeliveries = deliveries.map(d =>
          d.id === deliveryId ? { ...d, category } : d
        );
        setDeliveries(updatedDeliveries);
      };

      const deleteDelivery = (deliveryId) => {
        if (confirm('Czy na pewno chcesz usunąć tę dostawę?')) {
          setDeliveries(deliveries.filter(d => d.id !== deliveryId));
          resetFilters(deliveryId);
        }
      };

      const addItem = (deliveryId) => {
        const updatedDeliveries = deliveries.map(delivery => {
          if (delivery.id === deliveryId) {
            return {
              ...delivery,
              items: [...delivery.items, {
                id: Date.now().toString(),
                name: '',
                size: '',
                insertLength: '',
                condition: 'Nowe z metką',
                catalogPrice: '',
                sellPrice: '',
                saleDate: '',
                status: 'In stock'
              }]
            };
          }
          return delivery;
        });
        setDeliveries(updatedDeliveries);
      };



      const updateItem = (deliveryId, itemId, field, value) => {
        const updatedDeliveries = deliveries.map(delivery => {
          if (delivery.id === deliveryId) {
            return {
              ...delivery,
              items: delivery.items.map(item => {
                if (item.id === itemId) {
                  return { ...item, [field]: value };
                }
                return item;
              })
            };
          }
          return delivery;
        });
        setDeliveries(updatedDeliveries);
      };

      const deleteItem = (deliveryId, itemId) => {
        if (!confirm('Czy na pewno chcesz usunąć tę parę? Liczba par w kartonie zostanie zmniejszona o 1.')) return;
        const updatedDeliveries = deliveries.map(delivery => {
          if (delivery.id === deliveryId) {
            const newItems = delivery.items.filter(item => item.id !== itemId);
            const newPairsCount = Math.max(1, (Number(delivery.pairsCount) || 1) - 1);
            return {
              ...delivery,
              pairsCount: newPairsCount,
              items: newItems
            };
          }
          return delivery;
        });
        setDeliveries(updatedDeliveries);
      };

      // Filter Handlers
      const handleFilterChange = (deliveryId, key, value) => {
        setFilters(prev => ({
          ...prev,
          [deliveryId]: {
            ...(prev[deliveryId] || { status: 'All', minPrice: '', dateFrom: '', dateTo: '', sort: 'none' }),
            [key]: value
          }
        }));
      };

      const resetFilters = (deliveryId) => {
        setFilters(prev => {
          const next = { ...prev };
          delete next[deliveryId];
          return next;
        });
        setActivePopoverDeliveryId(null);
      };

      // Export/Import
      const exportData = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(deliveries, null, 2));
        const dlAnchorElem = document.createElement('a');
        dlAnchorElem.setAttribute("href", dataStr);
        const date = new Date().toISOString().replace(/:/g, '-').slice(0, 19);
        dlAnchorElem.setAttribute("download", `resell_backup_${date}.json`);
        document.body.appendChild(dlAnchorElem);
        dlAnchorElem.click();
        document.body.removeChild(dlAnchorElem);
        setIsMenuOpen(false);
      };

      const handleFileChange = (event) => {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const json = JSON.parse(e.target.result);
            if (!Array.isArray(json)) throw new Error("Invalid format");
            if (confirm('Uwaga: To nadpisze wszystkie obecne dane! Czy na pewno chcesz kontynuować?')) {
              setDeliveries(json);
              setFilters({}); // Reset all filters on import
            }
          } catch (err) {
            alert('Błąd odczytu pliku. Upewnij się, że to poprawny plik kopii zapasowej JSON.');
          }
          event.target.value = '';
          setIsMenuOpen(false);
        };
        reader.readAsText(file);
      };

      const exportCSV = (delivery, filteredItems) => {
        const unitCost = Number(delivery.pairsCount) > 0 ? (Number(delivery.boxCost) || 0) / Number(delivery.pairsCount) : 0;
        const headers = ['Produkt', 'Rozmiar', 'Stan', 'Status', 'Cena Katalogowa (PLN)', 'Cena Sprzedazy (PLN)', 'Koszt Jednostkowy (PLN)', 'Zysk (PLN)', 'Data Sprzedazy'];

        const rows = filteredItems.map(item => {
          const sell = Number(item.sellPrice) || 0;
          const profit = (item.status === 'Sold' || item.status === 'Shipped') ? (sell - unitCost) : 0;

          return [
            `"${(item.name || '').replace(/"/g, '""')}"`,
            `"${(item.size || '').replace(/"/g, '""')}"`,
            `"${item.condition || ''}"`,
            `"${item.status || ''}"`,
            Number(item.catalogPrice) || 0,
            sell,
            unitCost.toFixed(2),
            profit.toFixed(2),
            `"${item.saleDate || ''}"`
          ].join(',');
        });

        const csvContent = "data:text/csv;charset=utf-8,%EF%BB%BF" + encodeURIComponent([headers.join(','), ...rows].join('\n'));
        const dlAnchorElem = document.createElement('a');
        dlAnchorElem.setAttribute("href", csvContent);
        const date = new Date().toISOString().slice(0, 10);
        dlAnchorElem.setAttribute("download", `delivery_${delivery.name.replace(/[^a-z0-9]/gi, '_')}_${date}.csv`);
        document.body.appendChild(dlAnchorElem);
        dlAnchorElem.click();
        document.body.removeChild(dlAnchorElem);
      };

      const formatCurrency = (val) => {
        return new Intl.NumberFormat('pl-PL', { style: 'currency', currency: 'PLN' }).format(val || 0);
      };

      const getConditionClasses = (cond) => {
        switch (cond) {
          case 'Nowe z metką':
          case 'Nowe bez metki':
            return 'text-[#00e676] bg-[#004d00]/30 border-[#00e676]/30';
          case 'Bardzo dobry':
            return 'text-[#d500f9] bg-[#31004a]/30 border-[#d500f9]/30'
          case 'Dobry':
            return 'text-blue-400 bg-blue-500/20 border-blue-500/30';
          case 'Zadowalający':
            return 'text-amber-500 bg-amber-700/20 border-amber-700/30';
          case 'Uszkodzone':
            return 'text-red-400 bg-red-500/20 border-red-500/30';
          default:
            return 'text-white bg-transparent border-brand-border';
        }
      };

      const getStatusClasses = (status) => {
        switch (status) {
          case 'In stock': return 'text-blue-400 bg-blue-400/10 border-blue-400/20';
          case 'Posted': return 'text-purple-400 bg-purple-400/10 border-purple-400/20';
          case 'Shipped': return 'text-amber-400 bg-amber-400/10 border-amber-400/20';
          case 'Sold': return 'text-[#00E676] bg-[#00E676]/10 border-[#00E676]/20';
          default: return 'text-white bg-transparent border-brand-border';
        }
      };

      if (!unlocked) return <PinLock onUnlock={handleUnlock} />;

      return (
        <div className="min-h-screen pb-24 font-sans selection:bg-white/20">

          {/* Add Delivery Modal */}
          {isModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm transition-opacity">
              <div className="bg-brand-card border border-brand-border rounded-xl shadow-2xl w-full max-w-md overflow-hidden">
                <div className="px-6 py-4 border-b border-brand-border flex justify-between items-center">
                  <h3 className="text-lg font-semibold text-white">Dodaj nową dostawę</h3>
                  <button onClick={() => setIsModalOpen(false)} className="text-brand-muted hover:text-white transition-colors">
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                </div>
                <form onSubmit={handleAddDelivery} className="p-6 space-y-4">
                  <div>
                    <label className="block text-sm font-medium text-brand-muted mb-1.5">Nazwa dostawy</label>
                    <input
                      type="text"
                      required
                      autoFocus
                      value={newDelivery.name}
                      onChange={e => setNewDelivery({ ...newDelivery, name: e.target.value })}
                      className="w-full bg-brand-bg border border-brand-border rounded-lg px-3 py-2 text-white placeholder-brand-border focus:ring-1 focus:ring-white focus:border-white outline-none transition-all"
                      placeholder="np. Nike SNKRS - Luty"
                    />
                  </div>
                  <div>
                    <label className="block text-sm font-medium text-brand-muted mb-1.5">Data zakupu boxa</label>
                    <input
                      type="date"
                      required
                      value={newDelivery.purchaseDate}
                      onChange={e => setNewDelivery({ ...newDelivery, purchaseDate: e.target.value })}
                      className="w-full bg-brand-bg border border-brand-border rounded-lg px-3 py-2 text-white placeholder-brand-border focus:ring-1 focus:ring-white focus:border-white outline-none transition-all cursor-pointer"
                    />
                  </div>
                  <div>
                    <label className="block text-sm font-medium text-brand-muted mb-1.5">Kategoria boxa</label>
                    <select
                      value={newDelivery.category}
                      onChange={e => setNewDelivery({ ...newDelivery, category: e.target.value })}
                      className="w-full bg-brand-bg border border-brand-border rounded-lg px-3 py-2 text-white placeholder-brand-border focus:ring-1 focus:ring-white focus:border-white outline-none transition-all cursor-pointer"
                    >
                      <option value="Buty">Buty</option>
                      <option value="Ubrania">Ubrania</option>
                      <option value="Akcesoria">Akcesoria</option>
                      <option value="Inne">Inne</option>
                    </select>
                  </div>
                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block text-sm font-medium text-brand-muted mb-1.5">Kwota za karton (PLN)</label>
                      <input
                        type="number"
                        required
                        value={newDelivery.boxCost}
                        onChange={e => setNewDelivery({ ...newDelivery, boxCost: e.target.value })}
                        className="w-full bg-brand-bg border border-brand-border rounded-lg px-3 py-2 text-white placeholder-brand-border focus:ring-1 focus:ring-white focus:border-white outline-none transition-all"
                        placeholder="0"
                      />
                    </div>
                    <div>
                      <label className="block text-sm font-medium text-brand-muted mb-1.5">Liczba par w kartonie</label>
                      <input
                        type="number"
                        required
                        min="1"
                        value={newDelivery.pairsCount}
                        onChange={e => setNewDelivery({ ...newDelivery, pairsCount: e.target.value })}
                        className="w-full bg-brand-bg border border-brand-border rounded-lg px-3 py-2 text-white placeholder-brand-border focus:ring-1 focus:ring-white focus:border-white outline-none transition-all"
                        placeholder="1"
                      />
                    </div>
                  </div>
                  {Number(newDelivery.pairsCount) > 0 && Number(newDelivery.boxCost) > 0 && (
                    <div className="pt-2">
                      <p className="text-xs text-brand-muted">
                        Kalkulowany koszt za 1 parę: <span className="text-white font-medium">{formatCurrency(newDelivery.boxCost / newDelivery.pairsCount)}</span>
                      </p>
                    </div>
                  )}
                  <div className="pt-4 flex justify-end gap-3">
                    <button
                      type="button"
                      onClick={() => setIsModalOpen(false)}
                      className="px-4 py-2 text-sm font-medium text-brand-muted hover:text-white transition-colors"
                    >
                      Anuluj
                    </button>
                    <button
                      type="submit"
                      className="bg-white text-black hover:bg-gray-200 px-4 py-2 rounded-lg font-medium text-sm transition-colors shadow-[0_0_15px_rgba(255,255,255,0.1)]"
                    >
                      Zapisz dostawę
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}


          {/* Header */}
          <div className="fixed top-0 inset-x-0 z-50 group pointer-events-none flex flex-col">
            <div className="absolute top-0 inset-x-0 h-8 bg-transparent pointer-events-auto"></div>
            <header className="pointer-events-auto bg-brand-bg/95 backdrop-blur-md border-b border-brand-border -translate-y-full group-hover:translate-y-0 focus-within:translate-y-0 transition-transform duration-300 shadow-[0_10px_30px_rgba(0,0,0,0.5)]">
            <div className="max-w-[90rem] mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              <div className="flex items-center gap-4">
                <div className="flex items-center gap-3">
                  <div className="w-8 h-8 bg-brand-card border border-brand-border rounded flex items-center justify-center shadow-inner">
                    <i data-lucide="package" className="text-brand-muted w-4 h-4"></i>
                  </div>
                  <h1 className="font-semibold text-lg tracking-tight hidden sm:block mr-2">ResellTracker</h1>
                </div>

                <div className="h-6 w-px bg-brand-border mx-1"></div>

                {/* Global Time Filter */}
                <select
                  value={globalMonthFilter}
                  onChange={(e) => setGlobalMonthFilter(e.target.value)}
                  className="bg-brand-bg border border-brand-border text-white text-sm rounded-lg py-1.5 pl-3 pr-8 focus:ring-1 focus:ring-brand-border outline-none transition-colors cursor-pointer font-medium"
                >
                  <option value="All">Wszystkie dane</option>
                  {availableMonths.map(m => (
                    <option key={m.value} value={m.value}>{m.label}</option>
                  ))}
                </select>

                {/* Global Category Filter */}
                <select
                  value={globalCategoryFilter}
                  onChange={(e) => setGlobalCategoryFilter(e.target.value)}
                  className="bg-brand-bg border border-brand-border text-white text-sm rounded-lg py-1.5 pl-3 pr-8 focus:ring-1 focus:ring-brand-border outline-none transition-colors cursor-pointer font-medium"
                >
                  <option value="All">Wszystkie kategorie</option>
                  <option value="Buty">Buty</option>
                  <option value="Ubrania">Ubrania</option>
                  <option value="Akcesoria">Akcesoria</option>
                  <option value="Inne">Inne</option>
                </select>

                {/* Global Box Sorting */}
                <select
                  value={globalBoxSort}
                  onChange={(e) => setGlobalBoxSort(e.target.value)}
                  className="bg-brand-bg border border-brand-border text-white text-sm rounded-lg py-1.5 pl-3 pr-8 focus:ring-1 focus:ring-brand-border outline-none transition-colors cursor-pointer font-medium"
                >
                  <option value="desc">Sortuj: Najnowsze</option>
                  <option value="asc">Sortuj: Najstarsze</option>
                  <option value="alpha">Sortuj: A-Z</option>
                  <option value="alpha-desc">Sortuj: Z-A</option>
                  <option value="status-sold">Sortuj: Sprzedane na górze</option>
                  <option value="profit-desc">Sortuj: Zysk (Największy)</option>
                  <option value="profit-asc">Sortuj: Zysk (Najmniejszy)</option>
                </select>

                {/* Sync Status Badge */}
                {syncStatus === 'loading' && (
                  <span className="hidden md:flex text-xs font-medium text-brand-muted bg-brand-card border border-brand-border px-2 py-0.5 rounded-full items-center gap-1 sync-pulse">
                    <i data-lucide="cloud" className="w-3 h-3"></i>
                    Łączenie...
                  </span>
                )}
                {syncStatus === 'syncing' && (
                  <span className="hidden md:flex text-xs font-medium text-amber-400 bg-amber-400/10 border border-amber-400/20 px-2 py-0.5 rounded-full items-center gap-1 sync-pulse">
                    <i data-lucide="refresh-cw" className="w-3 h-3"></i>
                    Synchronizacja...
                  </span>
                )}
                {syncStatus === 'synced' && (
                  <span className="hidden md:flex text-xs font-medium text-[#00E676] bg-[#00E676]/10 border border-[#00E676]/20 px-2 py-0.5 rounded-full items-center gap-1">
                    <i data-lucide="cloud" className="w-3 h-3"></i>
                    Zsynchronizowano
                  </span>
                )}
                {syncStatus === 'offline' && (
                  <span className="hidden md:flex text-xs font-medium text-red-400 bg-red-400/10 border border-red-400/20 px-2 py-0.5 rounded-full items-center gap-1" title="Brak Firebase — skonfiguruj klucze lub pracujesz offline">
                    <i data-lucide="cloud-off" className="w-3 h-3"></i>
                    Offline
                  </span>
                )}
              </div>

              {/* Management Actions */}
              <div className="flex items-center gap-2">
                <div className="relative" ref={quarterlyRef}>
                  <button
                    onClick={() => setIsQuarterlyOpen(!isQuarterlyOpen)}
                    className="flex items-center gap-2 text-sm font-medium text-brand-muted hover:text-white bg-brand-bg border border-brand-border px-3 py-1.5 rounded-lg transition-colors hover:bg-brand-hover"
                  >
                    <i data-lucide="bar-chart-2" className="w-4 h-4"></i>
                    <span className="hidden sm:inline">Przychody kwartalne</span>
                  </button>
                  
                  {isQuarterlyOpen && quarterlyRevenue.length > 0 && (
                    <div className="absolute right-0 mt-2 w-64 rounded-xl bg-brand-card border border-brand-border shadow-2xl overflow-hidden z-50">
                      <div className="px-4 py-3 border-b border-brand-border flex items-center gap-2">
                        <div className="w-6 h-6 bg-brand-bg rounded-md border border-brand-border flex items-center justify-center">
                          <i data-lucide="bar-chart-2" className="w-3.5 h-3.5 text-[#00E676]"></i>
                        </div>
                        <span className="text-sm font-semibold text-white tracking-tight">Przychód kwartalny</span>
                      </div>
                      <table className="w-full text-sm">
                        <thead>
                          <tr className="border-b border-brand-border">
                            <th className="px-4 py-2 text-left text-xs font-medium text-brand-muted uppercase tracking-wider">Kwartał</th>
                            <th className="px-4 py-2 text-right text-xs font-medium text-brand-muted uppercase tracking-wider">Przychód</th>
                          </tr>
                        </thead>
                        <tbody>
                          {quarterlyRevenue.map(({ key, revenue }, idx) => (
                            <tr key={key} className={`${idx !== quarterlyRevenue.length - 1 ? 'border-b border-brand-border/50' : ''} hover:bg-brand-hover/40 transition-colors`}>
                              <td className="px-4 py-2.5 text-white font-medium whitespace-nowrap">{key}</td>
                              <td className="px-4 py-2.5 text-right font-semibold text-[#00E676] whitespace-nowrap">{formatCurrency(revenue)}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  )}
                  {isQuarterlyOpen && quarterlyRevenue.length === 0 && (
                    <div className="absolute right-0 mt-2 w-64 rounded-xl bg-brand-card border border-brand-border shadow-2xl overflow-hidden z-50 p-4 text-center text-sm text-brand-muted">
                      Brak danych o przychodach
                    </div>
                  )}
                </div>

                <div className="relative flex items-center" ref={menuRef}>

                <button
                  onClick={() => setIsMenuOpen(!isMenuOpen)}
                  className="p-2 rounded-lg text-brand-muted hover:text-white hover:bg-brand-hover transition-colors"
                >
                  <i data-lucide="more-vertical" className="w-5 h-5"></i>
                </button>

                {isMenuOpen && (
                  <div className="absolute right-0 mt-2 w-56 rounded-xl bg-brand-card border border-brand-border shadow-2xl py-1 z-50">
                    <input

                      ref={fileInputRef}
                      style={{ display: 'none' }}
                      onChange={handleFileChange}
                    />
                    <button
                      onClick={() => fileInputRef.current.click()}
                      className="w-full text-left px-4 py-2.5 text-sm text-brand-text hover:bg-brand-hover flex items-center gap-2 transition-colors"
                    >
                      <i data-lucide="upload" className="w-4 h-4 text-brand-muted"></i>
                      Importuj z pliku
                    </button>
                    <button
                      onClick={exportData}
                      className="w-full text-left px-4 py-2.5 text-sm text-brand-text hover:bg-brand-hover flex items-center gap-2 transition-colors"
                    >
                      <i data-lucide="download" className="w-4 h-4 text-brand-muted"></i>
                      Eksportuj kopię (JSON)

              </div>
            </div>
          </header>
          </div>

          <main className="max-w-[90rem] mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-10" ref={popoversRef}>

            <section>

              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-5">

    root.render(<App />);
  </script>
